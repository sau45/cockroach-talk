<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>State Cockroach Junctions Directory | CockroachTalk</title>
  <meta name="description" content="Browse state cockroach voice rooms across India. Instant access to Maharashtra Cockroach, Delhi Cockroach, Karnataka Cockroach, and more.">
  <link rel="canonical" href="https://cockroachtalk.com/junctions.html">

  <meta property="og:title" content="State Cockroach Junctions Directory | CockroachTalk">
  <meta property="og:description" content="Join live state cockroach voice rooms. Instant WebRTC audio streaming.">
  <meta property="og:url" content="https://cockroachtalk.com/junctions.html">

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/animations.css">

  <script type="module" src="js/includePartials.js"></script>
  <script type="module" src="js/pages/junctions.js"></script>
</head>
<body>

  <div id="site-header"></div>

  <main class="site-main">
    <section class="site-container">
      <div style="padding-top: 1.5rem; margin-bottom: 0.75rem; text-align: center;">
        <span class="badge-live" style="margin-bottom: 0.4rem;">
          <span class="badge-live-dot"></span> All State Junctions Active
        </span>
        <h1 style="font-size: clamp(1.6rem, 5vw, 2.5rem);">State Cockroach Voice Junctions</h1>
      </div>

      <!-- Controls: Search Input & Horizontal Category Filter Pills -->
      <div class="directory-controls">
        <div class="search-filter-bar">
          <input type="text" id="search-input" class="input-text" placeholder="🔍 Search state (e.g. Maharashtra, Delhi...)" aria-label="Search State Junction Rooms">
        </div>

        <div class="category-filter-scroll">
          <button class="btn btn-secondary btn-pill filter-btn active" data-category="all" style="padding: 0.35rem 0.85rem; font-size: 0.75rem;">
            All States & UTs
          </button>
          <button class="btn btn-secondary btn-pill filter-btn" data-category="north" style="padding: 0.35rem 0.85rem; font-size: 0.75rem;">
            North
          </button>
          <button class="btn btn-secondary btn-pill filter-btn" data-category="south" style="padding: 0.35rem 0.85rem; font-size: 0.75rem;">
            South
          </button>
          <button class="btn btn-secondary btn-pill filter-btn" data-category="west" style="padding: 0.35rem 0.85rem; font-size: 0.75rem;">
            West & Central
          </button>
          <button class="btn btn-secondary btn-pill filter-btn" data-category="east" style="padding: 0.35rem 0.85rem; font-size: 0.75rem;">
            East & NE
          </button>
        </div>
      </div>

      <!-- Symmetrical Chip Cards Grid -->
      <div id="junctions-grid" class="grid-rooms">
        <!-- Rendered dynamically by junctions.js -->
        <div class="skeleton skeleton-card" style="height: 110px;"></div>
        <div class="skeleton skeleton-card" style="height: 110px;"></div>
        <div class="skeleton skeleton-card" style="height: 110px;"></div>
        <div class="skeleton skeleton-card" style="height: 110px;"></div>
        <div class="skeleton skeleton-card" style="height: 110px;"></div>
        <div class="skeleton skeleton-card" style="height: 110px;"></div>
        <div class="skeleton skeleton-card" style="height: 110px;"></div>
        <div class="skeleton skeleton-card" style="height: 110px;"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <!-- Junction Conflict Modal — shown when user tries to join a different junction while already in one -->
  <div id="junction-conflict-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="jcm-title">
    <div class="modal-content profile-modal-content" style="max-width: 400px; text-align: center;">
      <button id="jcm-close" class="modal-close-btn" aria-label="Close">✕</button>

      <div style="font-size: 2.25rem; margin-bottom: 0.5rem;">🪲</div>
      <h3 id="jcm-title" style="font-size: 1.15rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">
        Already in a Junction
      </h3>
      <p id="jcm-body" style="font-size: 0.84rem; color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6;">
        You are currently in another junction. Leave it before joining a new one?
      </p>

      <div style="display: flex; gap: 0.75rem;">
        <button id="jcm-cancel" class="btn btn-secondary btn-pill" style="flex: 1; justify-content: center; font-size: 0.85rem;">
          Stay Here
        </button>
        <button id="jcm-confirm" class="btn btn-gold btn-pill" style="flex: 1; justify-content: center; font-size: 0.85rem; font-weight: 800;">
          Leave &amp; Join
        </button>
      </div>
    </div>
  </div>

</body>
</html>
